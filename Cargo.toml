[workspace]
resolver = "2"
members = [
    "crates/idv-common",
    "crates/idv-center",
    "crates/idv-edge",
    "crates/idv-pe-agent",
    "crates/idv-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Yixue IDV"]
repository = "https://github.com/example/idv_rust"

[workspace.dependencies]
idv-common = { path = "crates/idv-common" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
sysinfo = "0.33"
